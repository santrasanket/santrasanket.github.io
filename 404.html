<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Sanket Santra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root { --paper: #F3F5F8; --ink: #141922; --muted: #586172; --select: #0D7FE0; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #15181D; --ink: #E8ECF1; --muted: #9AA4B2; --select: #3BA2FF; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
    font: 17px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 24px; text-align: center; }
  img { border-radius: 50%; }
  h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 20px 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  a { display: inline-block; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; padding: 14px 22px; border-radius: 8px; }
  a:hover { background: var(--select); color: #fff; }
</style>
</head>
